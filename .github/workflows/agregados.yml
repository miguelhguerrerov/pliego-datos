name: agregados

# Recalcula las tablas agregadas enteras desde hecho_mes. Cuesta segundos.
on:
  schedule:
    - cron: "30 9 * * *"     # tras la ingesta diaria
  workflow_dispatch:

jobs:
  agregar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Clasificar lo recargado por la ingesta
        # La ingesta hace borrado y copia del mes: las filas nuevas entran sin
        # categoria. Sin esto, los dos meses del radar se descategorizan cada dia.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python src/clasifica.py --pendientes

      - name: Recalcular agregados
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python src/agrega.py

      - name: Guardias sobre la base cargada
        # Presupuesto de espacio y cifras de control. Detecta corrupcion silenciosa:
        # un normalizador que empieza a descartar filas, o una fuente que cambia.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m pytest pruebas/test_presupuesto.py -q

      - name: Consultas de producto
        # Las consultas que haria un usuario, como aserciones. Cuatro de los
        # catorce fallos de la fase 1 terminaron en verde con el dato mal:
        # las pruebas verificaban funciones, no resultados. Ver docs/metodo.md.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m pytest pruebas/test_producto.py -q

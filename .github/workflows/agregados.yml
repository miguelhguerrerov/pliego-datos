name: agregados

# Recalcula las tablas agregadas enteras desde hecho_mes. Cuesta segundos.
on:
  schedule:
    - cron: "30 9 * * *"     # tras la ingesta diaria
  workflow_dispatch:

jobs:
  agregar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: CPC de los abiertos
        # La ingesta preserva el cpc en las recargas (clasificacion_previa) y los
        # abiertos lo toman de sus items (0036). El clasificador de texto del LLM
        # murio con la taxonomia (D-045): la planificacion queda sin categoria hasta
        # que el CPC exista de verdad.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from carga import conexion
          with conexion() as con:
              with con.cursor() as cur:
                  cur.execute("select asignar_cpc_desde_items()")
                  print("cpc desde items:", cur.fetchone()[0])
              con.commit()
          PY

      - name: Recalcular agregados
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python src/agrega.py

      - name: Refrescar el resumen de mercados
        # Materializada porque el indice expiraba al calcularla al vuelo (0021). Como
        # toda tabla derivada, si nadie la refresca miente en silencio: dira las cifras
        # del dia anterior sin avisar de que son viejas.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from carga import conexion
          with conexion() as con:
              with con.cursor() as cur:
                  cur.execute("refresh materialized view concurrently v_portada")
                  cur.execute("refresh materialized view concurrently mercado_nodo")
                  cur.execute("refresh materialized view concurrently mercado_nodo_metodo")
                  cur.execute("refresh materialized view concurrently mercado_nodo_contratista")
                  cur.execute("refresh materialized view concurrently mercado_nodo_contratante")
              con.commit()
          print("agregados del arbol refrescados")
          PY

      - name: Guardias sobre la base cargada
        # Presupuesto de espacio y cifras de control. Detecta corrupcion silenciosa:
        # un normalizador que empieza a descartar filas, o una fuente que cambia.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m pytest pruebas/test_presupuesto.py -q

      - name: Consultas de producto
        # Las consultas que haria un usuario, como aserciones. Cuatro de los
        # catorce fallos de la fase 1 terminaron en verde con el dato mal:
        # las pruebas verificaban funciones, no resultados. Ver docs/metodo.md.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m pytest pruebas/test_producto.py -q

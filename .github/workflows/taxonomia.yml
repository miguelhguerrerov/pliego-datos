name: taxonomia

# Asigna el CPC de cabecera desde los items del Parquet publicado y recupera el
# referencial de subasta inversa. Ver D-045: la taxonomia del LLM murio; los nombres
# son los oficiales de cpc_nivel y aqui solo se ASIGNA, no se nombra.
#
# Mensual, dia 5, tras la publicacion mensual de Parquet (dia 3). Lo del dia a dia lo
# cubren la ingesta (clasificacion_previa + asignar_cpc_desde_items).
on:
  schedule:
    - cron: "0 12 5 * *"
  workflow_dispatch:
    inputs:
      seco:
        description: "Calcular y mostrar, sin escribir"
        required: false
        default: false
        type: boolean

jobs:
  clasificar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Asignar CPC desde los Parquet
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python src/clasifica_cpc.py ${{ inputs.seco && '--seco' || '' }}

      - name: Refrescar el arbol de mercado
        if: ${{ !inputs.seco }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from carga import conexion
          with conexion() as con:
              with con.cursor() as cur:
                  cur.execute("refresh materialized view concurrently v_portada")
                  cur.execute("refresh materialized view concurrently mercado_nodo")
                  cur.execute("refresh materialized view concurrently mercado_nodo_metodo")
                  cur.execute("refresh materialized view concurrently mercado_nodo_contratista")
                  cur.execute("refresh materialized view concurrently mercado_nodo_contratante")
              con.commit()
          print("agregados del arbol refrescados")
          PY

      - name: Compactar
        # Toda escritura masiva deja la tabla al doble en disco. Sin este paso la base
        # subio a 502 y luego a 534 MB, por encima del techo de 500 del plan gratuito
        # que deja el proyecto en solo lectura. Ver D-021 y D-024.
        if: ${{ !inputs.seco }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from clasifica import compactar
          from carga import conexion, tamano_mb
          with conexion() as con:
              antes = tamano_mb(con)
          compactar("proceso_resumen", "precio_cpc", "mercado_cpc_prov")
          with conexion() as con:
              print(f"base: {antes} -> {tamano_mb(con)} MB")
          PY

      - name: Consultas de producto
        # Una clasificacion que corre sin error puede dejar el 90% sin CPC.
        # Ver docs/metodo.md regla 1.
        if: ${{ !inputs.seco }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m pytest pruebas/test_producto.py pruebas/test_arbol.py -q

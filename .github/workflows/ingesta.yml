name: ingesta

# Diaria: mes en curso y anterior. Ahi nacen los estados planning y tender, que son el
# producto de radar. Son ~3 MB, cuesta segundos, y mantiene activo el proyecto de
# Supabase, que en plan gratuito se pausa tras una semana de inactividad.
#
# Con inputs desde/hasta sirve tambien para el backfill: 140 meses, menos de una hora.
on:
  schedule:
    - cron: "0 9 * * *"      # 09:00 UTC = 04:00 Ecuador
  workflow_dispatch:
    inputs:
      desde:
        description: "AAAA-MM inicial (vacio = incremental)"
        required: false
      hasta:
        description: "AAAA-MM final"
        required: false

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pruebas de contrato
        # Si la fuente cambio de esquema, no se carga nada.
        run: python -m pytest pruebas/ -q

      - name: Ingesta
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "${{ inputs.desde }}" ]; then
            python src/ingesta.py --desde "${{ inputs.desde }}" --hasta "${{ inputs.hasta || inputs.desde }}"
          else
            python src/ingesta.py --incremental
          fi

      - name: Refrescar las vistas materializadas
        # La portada y el indice de mercados se calculan una vez y se leen muchas. Si
        # nadie las refresca dan las cifras de ayer sin decir que son de ayer, que es
        # justo el tipo de mentira silenciosa que este proyecto ya ha pagado.
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from carga import conexion
          with conexion() as con:
              with con.cursor() as cur:
                  cur.execute("refresh materialized view concurrently v_mercado")
                  cur.execute("refresh materialized view concurrently v_portada")
              con.commit()
          print("v_mercado y v_portada refrescadas")
          PY

      - name: Detalle de los procesos abiertos
        # La ficha de un proceso necesita items, oferentes, pujas y consultas, y eso solo
        # viene por la ruta JSON. Se trae SOLO para lo que sigue abierto (~2.000 de
        # 280.000) y se reemplaza entero en cada pasada: cuando un proceso cierra, su
        # detalle sale de Postgres y se queda en el Parquet. Ver docs/decisiones.md D-035.
        #
        # No falla la ingesta si falla esto: el radar y las fichas no dependen del
        # detalle, y perder la ficha de proceso de un dia no justifica marcar el mes
        # como no cargado.
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python src/abiertos.py

      - name: Informe de cobertura
        # Informativo mientras el backfill este en curso: falla solo si faltan meses
        # de la ventana operativa, que es lo que este trabajo mantiene.
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python src/cobertura.py --informe
